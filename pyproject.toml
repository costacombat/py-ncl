[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "py-ncl"
description = "Python bindings to the Nickel configuration language, running Nickel in process"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
keywords = ["nickel", "configuration", "ncl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/bahiamovementcenter/py-ncl"
Nickel = "https://nickel-lang.org"

[dependency-groups]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "ncl._native"

